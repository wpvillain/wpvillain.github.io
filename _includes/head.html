<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>{{ page.title | default: site.title }}</title>
  {%- seo title=false -%}

  <link rel="icon" type="image/svg+xml" href="{{ "/assets/favicon.svg" | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/favicon-32.png" | relative_url }}">
  <link rel="icon" href="{{ "/assets/favicon.ico" | relative_url }}" sizes="any">
  <link rel="apple-touch-icon" href="{{ "/assets/apple-touch-icon.png" | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ "/feed.xml" | relative_url }}">
  <link rel="stylesheet" type="text/css" href="{{ "/assets/main.css" | relative_url }}">

  <script data-goatcounter="https://wpvillain.goatcounter.com/count"
          async src="https://gc.zgo.at/count.js"></script>
</head>
